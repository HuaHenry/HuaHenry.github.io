<div class="row mt-3">
    <div class="col">
        <div class="card border-0 shadow-sm bg-white">
            <div class="card-body p-4">
                <h6>Academic Service</h6>
                <ul class="list small pl-3 mb-1">
                    {% for item in site.data.profile.academic_service %}
                    <li>
                        <div class="d-flex">
                            <div><strong>{{ item.role }}</strong>: {{ item.venues | join: ", " }}</div>
                        </div>
                    </li>
                    {% endfor %}
                </ul>
            </div>
        </div>
    </div>
</div>
